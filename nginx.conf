# Replaces docker/nginx.conf of Open Topo Data v1.9.0: same server, plus /api/ aliases so the
# service can sit behind the existing `/oeapi/` -> `/api/` Traefik rewrite.
#   /api/v1/lookup      legacy Open-Elevation GET lookup, served by the "svalbard" dataset
#   /api/<anything>     Open Topo Data API (for example /api/v1/svalbard)
#   /<anything>         Open Topo Data API (direct access, health checks)
# Remove the legacy block once the frontend calls /v1/svalbard.
server {
    listen 5000 default_server;

    access_log /dev/stdout;
    error_log /dev/stdout info;

    gzip on;
    gzip_types application/json;
    gzip_min_length 200;

    server_tokens off;

    client_header_buffer_size 32k;
    large_client_header_buffers 4 64k;

    add_header X-Request-Time $request_time always;

    # Legacy Open-Elevation lookup. The query string is kept as is. The response is the Open Topo
    # Data one: `results[].elevation` is the same, `latitude`/`longitude` are now `location.lat/lng`.
    location = /api/v1/lookup {
        # The POST body of Open-Elevation differs from Open Topo Data's, so only GET is aliased.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        rewrite ^ /v1/svalbard break;
        include uwsgi_params;
        uwsgi_pass unix:/tmp/uwsgi.sock;
        uwsgi_read_timeout 30s;
        uwsgi_send_timeout 30s;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        include uwsgi_params;
        uwsgi_pass unix:/tmp/uwsgi.sock;
        uwsgi_read_timeout 30s;
        uwsgi_send_timeout 30s;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass unix:/tmp/uwsgi.sock;
        uwsgi_read_timeout 30s;
        uwsgi_send_timeout 30s;
    }
}
